script>

  </script> </head> <body class="fixed-top-nav "> <header> <nav id="navbar" class="navbar navbar-light navbar-expand-sm fixed-top" role="navigation"> <div class="container"> <a class="navbar-brand title font-weight-lighter" href="/"> Ada Johnson-Kanu </a> <button class="navbar-toggler collapsed ml-auto" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation"> <span class="sr-only">Toggle navigation</span> <span class="icon-bar top-bar"></span> <span class="icon-bar middle-bar"></span> <span class="icon-bar bottom-bar"></span> </button> <div class="collapse navbar-collapse text-right" id="navbarNav"> <ul class="navbar-nav ml-auto flex-nowrap"> <li class="nav-item "> <a class="nav-link" href="/">About </a> </li> <li class="nav-item "> <a class="nav-link" href="/cv/">CV </a> </li> <li class="nav-item "> <a class="nav-link" href="/books/">Book Projects </a> </li> <li class="nav-item active"> <a class="nav-link" href="/publications/">Research <span class="sr-only">(current)</span> </a> </li> <li class="nav-item "> <a class="nav-link" href="/teaching/">Teaching </a> </li> <li class="toggle-container"> <button id="light-toggle" title="Change theme"> <i class="ti ti-sun-moon" id="light-toggle-system"></i> <i class="ti ti-moon-filled" id="light-toggle-dark"></i> <i class="ti ti-sun-filled" id="light-toggle-light"></i> </button> </li> </ul> </div> </div> </nav> <progress id="progress" value="0"> <div class="progress-container"> <span class="progress-bar"></span> </div> </progress> </header> <div class="container mt-5" role="main"> <style type="text/css">.pubs-section h2{font-size:1.4rem;font-weight:700;margin:2.5rem 0 1.2rem;padding-bottom:.3rem;border-bottom:2px solid var(--global-theme-color)}.pubs-section:first-child h2{margin-top:0}.pubs-card{border-left:3px solid color-mix(in srgb,var(--global-theme-color) 40%,transparent);border-radius:0 10px 10px 0;padding:.7rem .9rem;margin-bottom:.9rem;background:rgba(127,127,127,0.06);transition:border-left-color .2s,background .2s}.pubs-card:hover{border-left-color:var(--global-theme-color);background:rgba(127,127,127,0.10)}.pubs-card h4{margin:0 0 .25rem;font-size:1.02rem;font-weight:600;line-height:1.35}.pubs-card h4 a{color:var(--global-text-color)}.pubs-card h4 a:hover{color:var(--global-theme-color);text-decoration:none}.pubs-meta{color:var(--global-text-color-light);font-size:.88rem;margin-bottom:.3rem}.pubs-meta strong{font-weight:600}.pubs-status{color:var(--global-theme-color);font-weight:700}.pubs-badges{display:flex;flex-wrap:wrap;gap:.25rem;margin:.15rem 0 .4rem}.pubs-badge{font-size:.72rem;padding:.1rem .45rem;border-radius:999px;color:var(--global-text-color)}.pubs-award{background:rgba(217,164,6,0.12);border:1px solid rgba(217,164,6,0.35);font-weight:600}.pubs-award .fa-trophy{color:#d9a406;margin-right:.2rem}.pubs-card details{margin:.2rem 0 0}.pubs-card details summary{font-size:.82rem;font-weight:600;cursor:pointer;color:var(--global-theme-color)}.pubs-abstract{margin-top:.4rem;font-size:.88rem;line-height:1.55;color:var(--global-text-color);opacity:.9}.pubs-actions{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin-top:.45rem}.pubs-action{display:inline-flex;align-items:center;gap:.3rem;border:1px solid var(--global-divider-color);background:transparent;border-radius:999px;padding:.2rem .65rem;font-size:.8rem;font-weight:normal;text-decoration:none;color:var(--global-text-color);cursor:pointer}.pubs-action:hover{background:rgba(127,127,127,0.10);text-decoration:none;color:var(--global-text-color)}.pubs-action--primary{border-color:color-mix(in srgb,var(--global-theme-color) 45%,transparent);font-weight:600}.pubs-note{font-size:.8rem;color:var(--global-text-color-light)}.pubs-bibpanel{display:none;margin-top:.7rem;border:1px solid var(--global-divider-color);background:rgba(127,127,127,0.05);border-radius:12px;padding:.7rem}.pubs-bibpanel.is-open{display:block}.pubs-bibhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem}.pubs-bibtitle{font-size:.85rem;font-weight:600}.pubs-copybtn{border:1px solid var(--global-divider-color);background:rgba(127,127,127,0.06);border-radius:999px;padding:.2rem .55rem;font-size:.8rem;color:var(--global-text-color);cursor:pointer}.pubs-bibpre{margin:0;white-space:pre-wrap;font-size:.78rem;line-height:1.4}</style> <div class="post"> <header class="post-header"> <h1 class="post-title">Research</h1> <p class="post-description"></p> </header> <article> <div id="pubs-app"> <noscript>This page needs JavaScript to display the list of papers. A full list is in my <a href="/cv/">CV</a>.</noscript> </div> <script>window.RESEARCH_DATA = {"published":[{"id":"marikana","year":2024,"title":"State Violence, Party Formation, and Electoral Accountability: The Political Legacy of the Marikana Massacre","authors":"\u003ca href=\"https://www.ddekadt.com/\"\u003eDaniel de Kadt\u003c/a\u003e, Ada Johnson-Kanu, and \u003ca href=\"https://www.melissasands.org/\"\u003eMelissa Sands\u003c/a\u003e","journal":"American Political Science Review","volume":"118","issue":"2","pages":"563–583","note":"Lead article","categories":["Elections \u0026 Accountability","State Violence \u0026 Policing"],"abstract":"Democratic governments sometimes use violence against their people, yet little is known about the electoral consequences of these events. Studying South Africa's Marikana massacre, we document how a new opposition party formed as a direct result of violence, quantify significant electoral losses for the incumbent, and show that those losses were driven by voters switching from the incumbent to the new party. Three lessons emerge. First, incumbents who preside over state violence may be held electorally accountable by voters. Second, such accountability seemingly depends on the existence of credible opposition parties that can serve as a vector for disaffected voters. Where such parties do not exist, violence may create political cleavages that facilitate the formalization of opposition movements. Third, immediate proximity to violence is correlated with holding incumbents accountable.","links":{"article":"https://www.cambridge.org/core/journals/american-political-science-review/article/state-violence-party-formation-and-electoral-accountability-the-political-legacy-of-the-marikana-massacre/53053BE87AC75FE723B5E447E0AA0A28","draft":"/assets/pdf/papers/marikana-apsr.pdf","replication":"https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/SAA71U","bibtex":"@article{dekadt2024state,\n  title={State Violence, Party Formation, and Electoral Accountability: The Political Legacy of the Marikana Massacre},\n  author={de Kadt, Daniel and Johnson-Kanu, Ada and Sands, Melissa L.},\n  journal={American Political Science Review},\n  volume={118},\n  number={2},\n  pages={563--583},\n  year={2024},\n  publisher={Cambridge University Press}\n}\n"}}],"working":[{"id":"local-elections","title":"The Limits of Local Elections Under Subnational Authoritarianism: Evidence From Nigeria","authors":"Nicholas Cruz and Ada Johnson-Kanu","status":"Under review","categories":["Elections \u0026 Accountability","Subnational Politics","Public Services"],"abstract":"When do local government (LG) elections fail to improve public service delivery? Using Nigeria as a case study, we develop a theory of electoral institutions that explains how unconstrained subnational executives can exploit decentralized electoral institutions to disrupt democratic accountability at the local level, thereby neutralizing the incentive to provide adequate public services. By absorbing electoral institutions into clientelistic political machines, Nigerian governors can influence both the selection of candidates and election outcomes themselves. Nigerian governors are known to illegally cancel local elections and instead directly appoint \"caretaker\" committees. Where local elections were held, the political party of state governors has consistently won an overwhelming majority of all LG chairmanship elections. Using data on healthcare and education outcomes from the Nigerian General Household Survey (2010–2018) and a difference-in-differences design, we find that elected local leaders perform no better than appointed ones, across various model specifications. Consequently, we conclude that the introduction of LG elections are of little significance to Nigeria's public services due to the capture of both the LG electoral process and LG funds by state governors. This research contributes to a growing literature on subnational authoritarianism, showing how decentralized electoral institutions, often promoted as vehicles to further democratization, can instead be weaponized by subnational authoritarian leaders to entrench their control.","links":{"draft":"/assets/pdf/papers/local-elections.pdf"}},{"id":"fuel-subsidy","title":"Fuel Subsidy Removal in Nigeria: Household Welfare and Public Opinion","authors":"Ada Johnson-Kanu","status":"Revise and resubmit","categories":["Public Opinion \u0026 Welfare","Political Economy"],"abstract":"This article assesses the effects of fuel subsidy removal on Nigerian households using panel data from the Nigeria National Longitudinal Phone Survey. Employing a difference-in-differences strategy exploiting geographic variation in fuel supply infrastructure and urban–rural differences in fuel dependence, we find adverse welfare effects following the May 2023 reform. Households in states with greater fuel depot infrastructure experienced larger welfare declines. Urban households experienced greater deterioration in consumption and food security. A triple-difference specification yields results robust to confounding threats. Approximately 87 per cent of respondents disapproved of removal, citing increased prices. Absent compensatory transfers, fuel subsidy removal generates significant welfare costs concentrated among populations most dependent on formal fuel markets.","links":{"draft":"/assets/pdf/papers/fuel-subsidy.pdf"}},{"id":"man-leopard","title":"The Man Leopard Murders and Contemporary Trust in the Nigerian Criminal Justice System","authors":"Ada Johnson-Kanu and Godwin Okore","status":"Under review","categories":["Historical Legacies","State Violence \u0026 Policing"],"abstract":"Between 1943 and 1948, more than 200 people were killed in Calabar Province, Nigeria, by individuals disguised as leopards. The colonial administration responded with the largest police investigation in Nigerian colonial history and a public court process that resulted in the arrest of 96 suspects and the execution of 77 persons found guilty by the court. We examine whether these events generated long-term trust in criminal justice institutions. Using geolocated Afrobarometer data (rounds 3–9) matched to historical boundaries, we find that residents of Calabar Province report substantially higher trust in courts than residents of the surrounding South East region. The effect is specific to courts: placebo tests on six other outcomes of institutional trust are null. Trust in the police is elevated only within the Man Leopard zone itself, where the police investigation was concentrated. Cohort analysis shows the trust-in-courts advantage is concentrated among the 1940s and 1980s birth cohorts; and the effect is stronger among men, consistent with the gendered transmission of memory about the events. The court trial left a more durable legacy than the police investigation, suggesting that visible judicial resolution of community crises can build lasting institutional trust.","links":{"draft":"/assets/pdf/papers/man-leopard.pdf"}},{"id":"state-legislatures","title":"One-Party Legislatures? Partisan Dominance in Nigeria's State Houses of Assembly","authors":"Ada Johnson-Kanu","status":"Under review","categories":["Subnational Politics","Legislatures"],"abstract":"Party-system fragmentation is conventionally interpreted as evidence of competition, and competition as the engine of accountability. This paper identifies a condition under which that inference fails. Drawing on an original dataset of 2,975 legislators across all 36 Nigerian states and three electoral cycles (2015, 2019, 2023), I document a puzzle: between 2015 and 2023 the effective number of parties in the state assemblies rose and zero-opposition chambers all but disappeared, yet the governor's party retained supermajority control of the floor. I argue that opposition fragmentation operated as a mechanism of authoritarian resilience. New parties entered divided, each lacking the patronage infrastructure to cohere into a legislative bloc, so splitting the anti-incumbent vote produced the appearance of pluralism without the substance of accountability. A governor party-switch quasi-experiment, in which the incoming party is exogenous to the assembly's composition, and a cross-carpeting analysis of returning legislators trace the mechanism. The Nigerian case extends the subnational authoritarianism framework and specifies when counting parties conceals executive capture.","links":{"draft":"/assets/pdf/papers/state-legislatures.pdf"}},{"id":"speaker-selection","title":"The Governor's Choice? Speaker Selection in Nigerian State Assemblies","authors":"Ada Johnson-Kanu","status":"Under review","categories":["Subnational Politics","Legislatures"],"abstract":"Legislatures elect their own presiding officers, yet these officers do not always answer to the chambers that elect them. When does the presiding officer serve the legislative majority, and when the executive? I argue that the effective principal is set by who controls the two resources legislators depend on to hold their seats: entry through candidate nomination, and the fiscal and patronage base that sustains a career. Where the executive controls both and the legislature is weakly institutionalized, the presiding officer becomes an agent of the executive. Using an original dataset covering all 36 Nigerian states across three electoral cycles, 2,975 legislators, I show that Speakers come from the governor's party almost without exception, that governors install junior members over senior co-partisans, and that where the governor's party trails in the chamber the Speaker still follows the governor. The argument generates comparable predictions for other federal democracies in which executives control nomination and intergovernmental transfers.","links":{"draft":"/assets/pdf/papers/speaker-selection.pdf"}},{"id":"precolonial-agriculture","title":"Precolonial States and Development: Evidence from Agriculture in Africa","authors":"Ada Johnson-Kanu and \u003ca href=\"https://sites.google.com/view/adasgupta/home?authuser=0\"\u003eAditya Dasgupta\u003c/a\u003e","categories":["Historical Legacies","Colonialism \u0026 Precolonial States","Political Economy"],"draft_note":"Draft available upon request","abstract":"Low agricultural productivity is a major source of poverty in Africa, where much of the population works in agriculture, yet subsistence production and food insecurity are widespread. However, some pockets of agriculture in Africa are highly productive. In this paper, we assemble a geospatial dataset of all pre-colonial African states in existence between 1500 and 1850, and utilize remote-sensing data based on satellite imagery to show that areas (pixels) in proximity to the location of pre-colonial state capitals display higher levels of contemporary agricultural output. This relationship exists across and within countries, agro-ecological zones, and river basins. We rule out spurious correlation with spatial randomization tests. We argue that via path-dependence and spatial agglomeration effects, pre-colonial states transmitted the territorial reach that was critical for state-led agricultural modernization in the twentieth century. The findings support a growing literature linking contemporary economic development to state capacity transmitted from pre-colonial political institutions."},{"id":"ethnic-representation","title":"The Historical Roots of Ethnic Representation in the Civil Service","authors":"Ada Johnson-Kanu","categories":["Bureaucracy \u0026 Representation","Historical Legacies"],"draft_note":"Draft available upon request","abstract":"A large body of scholarship suggests that group representation in the bureaucracy has important consequences for distributive politics. But why do some ethnic groups have better bureaucratic representation than do others? Using data on bureaucratic personnel spanning nearly a century, I trace how the Nigerian Federal Civil Service – the country's national bureaucracy – emerged from the colonial state building process. I argue and show that ethnic groups with greater exposure to colonial education, and without an entrenched alternative to it, gained early entry into the colonial bureaucracy. These first entrants were subsequently more likely to be highly represented in the bureaucracy over time. Examining the ethnicity of individual civil servants and of new hires up to 1972, I show that the composition of fresh recruitment reproduces the standing composition of each agency, so that representation regenerates rather than merely surviving through incumbents. This reproduced advantage proves difficult to dislodge. It survives independence, the military coups of 1966, and the civil war, and the same groups remain dominant in the same agencies decades later, largely untouched by the Federal Character reforms of the 1990s. I theorize that this durability reflects first entrants maintaining their advantage through preferential hiring and targeted investment in the education of their co-ethnics."}],"progress":[{"id":"colonial-treaties","title":"The Political Economy of Colonial Treaty-Making: Evidence from British Treaties in West Africa, 1788–1901","authors":"Ada Johnson-Kanu","categories":["Colonialism \u0026 Precolonial States","Historical Legacies"],"draft_note":"Draft available upon request","abstract":"Between 1788 and 1901, British agents in West Africa concluded 480 documents called treaties. The contents of these so-called treaties have been interpreted in two opposite ways. African scholars dispute the term: the documents satisfy none of the conditions international law assigns to treaty-making. A second tradition treats the same documents as evidence of African agency in the partition of Africa. I reconcile these competing interpretations. I argue that these documents served two purposes. The documents served as instruments for pacifying African elites at low cost, and as instruments of territorial claim-making against rival European powers. Using a panel of 824 West African polities and 480 treaties coded from Hertslet's \u003cem\u003eMap of Africa by Treaty\u003c/em\u003e, I show that military capacity shapes treaty form between standardized and individually negotiated treaties. Treaty polities were no less likely than non-treaty polities to be inside European territory early, and by 1895 both groups had reached the ceiling of 100 percent occupation. Treaty production clusters around the Berlin Conference, with a structural break at the Berlin Conference from coastal contested zones to signings within each power's allocated territory. Yes, African rulers exercised agency in the moment of signing, but the treaties were designed to produce colonization; bargaining within the treaty system may have changed its terms, not the trajectory it set in motion."},{"id":"mandate-fit","title":"Whose Job Is It? Mandate Fit and the Delegation of Constituency Projects in Nigeria","authors":"Ada Johnson-Kanu","categories":["Bureaucracy \u0026 Representation","Distributive Politics"],"draft_note":"Draft available upon request","abstract":"Nigerian audit organizations report that a third of constituency projects are assigned to agencies whose mandates do not cover the work, but a rate says nothing about the alternatives a legislator passed over. With Nigeria's Zonal Intervention Projects the legislator selects the implementing agency and may select any federal body, so the delegation decision is recorded. I build the policy–agency congruence measure, which scores a project's fit to an agency's statutory mandate, and fit a conditional logit over sixteen candidate ministries to 11,178 projects. Mandate fit predicts the choice better than anything else I measure; legislators reach the best-matched ministry at five times the rate indifference would produce and still miss two thirds of the time. Half of that miss reaches a ministry with a real but secondary claim, and half reaches a ministry with no claim at all. A ministry whose oversight committee the sponsor chairs is about three times as likely to receive the project, holding mandate fit constant, and the tie weighs twice as much for projects whose delivery cannot be inspected. Longer-serving legislators weigh mandate fit more. Neither ethnic representation among a ministry's officials nor its integrity ranking predicts where projects go."},{"id":"two-audiences","title":"Two Audiences, Many Forms: The Language of British Colonial Treaties in West Africa","authors":"Ada Johnson-Kanu","categories":["Colonialism \u0026 Precolonial States","Historical Legacies"],"draft_note":"Draft available upon request","abstract":"The 480 West African instruments that Hertslet's \u003cem\u003eMap of Africa by Treaty\u003c/em\u003e records for the years 1788 to 1901 have supported two incompatible readings, one in which they are contracts of dispossession that no one consented to and one in which they are the record of African rulers bargaining with the partition. This article puts the language of the documents themselves at the centre and finds that each reading describes part of a text written for two readers. One register, addressed to rival European powers and to the Foreign Office, records cession, sovereign rights, jurisdiction and the exclusion of other Europeans. A second register, addressed to the African signatory, records protection, non-interference with native law, payment, and a growing apparatus of witnesses and interpreters attesting to consent. The ten printed forms of the Royal Niger Company show the first register expanding from \"cede the whole of our territory\" in 1884 to \"the authorized Government of our territories\" in 1890, while the consent apparatus thickened in step. Negotiated treaties with Sokoto, Gandu, Borgu and Lagos admit the counterpart's own constitutional forms into the text. Four cases (Opobo, Egba, Borgu and Lagos), together with two polities incorporated with no treaty at all, show what happened when signatories acted on the register addressed to them: the European register prevailed. It prevailed again in 2002, when the International Court of Justice adjudicated the 1884 Old Calabar treaty. The two interpretations are both correct, because they describe different halves of the same document."},{"id":"power-shared","title":"How Is Power Shared Below the Cabinet? Ethnic and Gender Representation in the Nigerian Federal Civil Service","authors":"Ada Johnson-Kanu and Sullivan K. Edeani","categories":["Bureaucracy \u0026 Representation","Ethnic Politics"],"abstract":"Executives in diverse societies spread cabinet portfolios across ethnic lines, and a large literature treats that distribution as evidence of inclusion. Cabinets set policy; they do not implement it. This paper asks how far the balancing reaches into the bureaucracy that does. Appointments become harder to inspect at each tier below the cabinet, and this paper expects representation to narrow with them. Nigeria holds the formal rule constant while that visibility varies: the federal character principle covers every cadre of the public service, not political office alone. This paper assembles the posting circulars that move senior officers between ministries, the promotion circulars that raise them into the directorate, a roster of permanent secretaries, and the federal cabinet, and codes the ethnic group and the gender of every person in all three tiers on one scheme. Because the circulars record officers who moved or were promoted rather than the standing cadre, this paper benchmarks them against the last published count of the directorate, the Federal Character Commission's 2011 roster of 4,503 officers, and reports what that comparison shows the records can and cannot support. Gender enters as a second dimension, produced by examination and promotion rules rather than by appointment, and is expected to behave differently from ethnic representation."},{"id":"military-capacity","title":"Precolonial Military Capacity, Colonial Incorporation, and State Violence","authors":"Ada Johnson-Kanu","categories":["Colonialism \u0026 Precolonial States","State Violence \u0026 Policing"],"abstract":"Studies of precolonial centralization and contemporary outcomes treat centralization as a fixed characteristic, and the standard measures capture administrative hierarchy rather than coercive strength. I introduce an original dataset of 258 precolonial African polities (existence 1500–1915) coded for military characteristics: army size, organization, cavalry, firearms, fortifications, naval capacity, and outcomes against European forces. The measure indexes coercive capacity and is distinct from centralization indices such as Murdock V33, with which it shares limited variance continent-wide. I argue that military capacity determined the mode by which a polity was incorporated into colonial rule. Weak and decentralized polities were absorbed by fiat, through administrative extension or an inter-imperial boundary agreement, without treaty or battle. Polities of moderate capacity were incorporated by diplomacy, through negotiated treaties that led to indirect rule. Capable polities were incorporated by force, through conquest and punitive expeditions. The mode of incorporation set the level of state violence a polity's population faced under colonial rule, and colonial-era violence persists into contemporary patterns of state violence against civilians. I test the chain from military capacity through incorporation mode and colonial violence to contemporary violence using ACLED data on state violence against civilians matched to the geocoded polities. The account decomposes the centralization composite, administrative hierarchy on one side and coercive capacity on the other, and reads the precolonial paradox as concentrated where centralization coincided with military capacity, because that combination drew incorporation by force."}],"other":[{"id":"kerr-review","year":2026,"title":"Review of \u003cem\u003eElectoral Commissions and Democratization in Africa: Everyday Production of Democratic Legitimacy\u003c/em\u003e by Nicholas Kerr","authors":"Ada Johnson-Kanu","journal":"Africa Spectrum","note":"Book review","categories":["Elections \u0026 Accountability"]},{"id":"broadstreet-2022","year":2022,"title":"Historical Origins of Ethnic Representation in the Nigerian Bureaucracy","authors":"Ada Johnson-Kanu","journal":"Broadstreet","note":"Blog post","categories":["Bureaucracy \u0026 Representation","Historical Legacies"]},{"id":"cp-newsletter-2021","year":2021,"title":"Origins and Consequences of Descriptive Representation in the Nigerian Civil Service","authors":"Ada Johnson-Kanu","journal":"APSA Comparative Politics Newsletter","note":"Fall 2021","categories":["Bureaucracy \u0026 Representation","Ethnic Politics"]},{"id":"sio-2020","year":2020,"title":"#ZakzakyLifeMatters: An Investigation into a Facebook Operation Linked to the Islamic Movement in Nigeria","authors":"Shelby Grossman, Sean Gallagher, Ada Johnson-Kanu, Nicole Wilson, and David Thiel","journal":"Stanford Internet Observatory","note":"Report","categories":["Public Opinion \u0026 Welfare"]}]};</script> <script src="/assets/js/research.js"></script> </article> </div> </div> <footer class="fi
